<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnostic Visibilité — DEBELIOU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --blue:     #8bbac3;
    --yellow:   #ffe865;
    --teal:     #22e3b9;
    --ink:      #277487;
    --ink-dark: #1a4f5c;
    --ink-mid:  #3d7d8f;
    --muted:    #7aacb8;
    --blue-bg:  #eef5f7;
    --teal-bg:  #e3faf5;
    --line:     #d4e8ee;
    --cream:    #f7fcfd;
    --white:    #ffffff;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  body {
    font-family: 'Poppins', sans-serif;
    font-weight: 400;
    background: var(--cream);
    color: var(--ink-dark);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  .shell { width: 100%; max-width: 600px; }

  .brand {
    text-align: center;
    margin-bottom: 20px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .brand span { color: var(--ink-dark); font-weight: 900; }

  .card {
    background: var(--white);
    border: 1.5px solid var(--line);
    border-radius: 22px;
    padding: 42px 38px;
    box-shadow: 0 4px 28px rgba(39,116,135,0.09);
    animation: fadeUp 0.32s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* PROGRESS */
  .prog-wrap { margin-bottom: 32px; }
  .prog-track { height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .prog-fill {
    height: 100%; background: var(--teal); border-radius: 99px;
    transition: width 0.4s cubic-bezier(0.16,1,0.3,1);
  }
  .prog-meta {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 10px;
  }
  .prog-label {
    font-size: 11px; font-weight: 700; color: var(--muted);
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .prog-pilier {
    font-size: 11px; font-weight: 700; color: var(--teal);
    letter-spacing: 0.06em; text-transform: uppercase;
  }

  /* TYPO */
  .eyebrow {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.12em; color: var(--teal); margin-bottom: 12px;
  }
  h1 {
    font-weight: 900; font-size: 30px; line-height: 1.1;
    color: var(--ink-dark); margin-bottom: 16px;
  }
  .lede {
    font-size: 15px; font-weight: 400; color: var(--ink-mid);
    line-height: 1.65; margin-bottom: 10px;
  }
  .sub {
    font-size: 13px; font-weight: 400; color: var(--muted);
    margin-bottom: 28px; line-height: 1.55;
  }

  /* META STRIP INTRO */
  .meta-strip {
    display: flex; border: 1.5px solid var(--line); border-radius: 14px;
    overflow: hidden; margin-bottom: 28px; background: var(--blue-bg);
  }
  .meta-item {
    flex: 1; padding: 16px 12px; text-align: center;
    border-right: 1.5px solid var(--line);
  }
  .meta-item:last-child { border-right: none; }
  .meta-item strong {
    display: block; font-weight: 900; font-size: 20px;
    color: var(--ink-dark); letter-spacing: -0.01em;
  }
  .meta-item span {
    font-size: 11px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.05em;
  }

  /* BUTTONS */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px; border: none; border-radius: 12px;
    font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 15px;
    cursor: pointer; transition: opacity 0.15s, transform 0.15s;
    padding: 16px 22px; width: 100%; letter-spacing: 0.01em;
  }
  .btn:active { transform: scale(0.98); }
  .btn:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
  .btn-primary { background: var(--ink-dark); color: var(--yellow); font-weight: 900; }
  .btn-primary:hover { background: var(--ink); }
  .btn-ghost {
    background: transparent; color: var(--muted); font-size: 13px;
    font-weight: 700; width: auto; padding: 8px 4px;
  }
  .btn-ghost:hover { color: var(--ink-dark); }
  .nav { display: flex; align-items: center; justify-content: space-between; margin-top: 24px; }

  /* OPTIONS */
  .q-title {
    font-weight: 900; font-size: 20px; line-height: 1.28;
    color: var(--ink-dark); margin-bottom: 22px;
  }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 14px 16px; border: 1.5px solid var(--line); border-radius: 12px;
    cursor: pointer; background: var(--white); text-align: left;
    font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 400;
    color: var(--ink-dark); line-height: 1.45; width: 100%;
    transition: border-color 0.12s, background 0.12s;
  }
  .option:hover { border-color: var(--teal); background: var(--teal-bg); }
  .option:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  .option.selected { border-color: var(--teal); background: var(--teal-bg); }
  .opt-dot {
    width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line);
    flex-shrink: 0; margin-top: 2px; position: relative; transition: border-color 0.12s;
  }
  .option.selected .opt-dot { border-color: var(--teal); }
  .option.selected .opt-dot::after {
    content: ''; position: absolute; inset: 3px;
    border-radius: 50%; background: var(--teal);
  }

  /* RÉSULTAT */
  .result-intro { text-align: center; margin-bottom: 32px; }
  .result-intro h2 {
    font-weight: 900; font-size: 24px; color: var(--ink-dark);
    margin-bottom: 8px; line-height: 1.2;
  }
  .result-intro p { font-size: 14px; color: var(--muted); line-height: 1.6; }

  .piliers { display: flex; flex-direction: column; gap: 20px; margin-bottom: 28px; }

  .pilier-card {
    border: 1.5px solid var(--line); border-radius: 14px;
    padding: 20px 22px; background: var(--white);
  }
  .pilier-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
  }
  .pilier-name {
    font-weight: 900; font-size: 15px; color: var(--ink-dark);
    display: flex; align-items: center; gap: 8px;
  }
  .pilier-icon { font-size: 18px; }
  .pilier-niveau {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; padding: 4px 10px; border-radius: 99px;
  }
  .niveau-faible { background: #FFF3E0; color: #E65100; }
  .niveau-moyen  { background: var(--yellow); color: var(--ink-dark); }
  .niveau-fort   { background: var(--teal-bg); color: var(--ink); }

  .pilier-track {
    height: 7px; background: var(--blue-bg); border-radius: 99px;
    overflow: hidden; margin-bottom: 10px; border: 1px solid var(--line);
  }
  .pilier-fill {
    height: 100%; border-radius: 99px;
    transition: width 1s cubic-bezier(0.16,1,0.3,1);
  }
  .fill-notoriete  { background: linear-gradient(to right, var(--blue), var(--ink)); }
  .fill-fidelisation { background: linear-gradient(to right, var(--yellow), #f5a623); }
  .fill-differenciation { background: linear-gradient(to right, var(--teal), var(--ink)); }

  .pilier-text { font-size: 13px; color: var(--ink-mid); line-height: 1.6; }

  /* RECOMMANDATIONS */
  .reco-section { margin-bottom: 28px; }
  .reco-title {
    font-weight: 900; font-size: 16px; color: var(--ink-dark);
    margin-bottom: 14px;
  }
  .reco-items { display: flex; flex-direction: column; gap: 10px; }
  .reco-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 16px; background: var(--blue-bg);
    border-radius: 12px; border: 1px solid var(--line);
  }
  .reco-num {
    width: 26px; height: 26px; border-radius: 50%; background: var(--ink-dark);
    color: var(--yellow); font-size: 12px; font-weight: 900;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .reco-content { flex: 1; }
  .reco-label { font-weight: 700; font-size: 13px; color: var(--ink-dark); margin-bottom: 3px; }
  .reco-desc { font-size: 12px; color: var(--ink-mid); line-height: 1.5; }

  /* CTA DEVIS */
  .cta-box {
    background: var(--ink-dark); border-radius: 16px;
    padding: 28px 26px; text-align: center; margin-bottom: 8px;
  }
  .cta-box h3 {
    font-weight: 900; font-size: 20px; color: var(--yellow);
    margin-bottom: 8px; line-height: 1.2;
  }
  .cta-box p { font-size: 13px; color: var(--blue); margin-bottom: 20px; line-height: 1.6; }
  .btn-cta {
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--yellow); color: var(--ink-dark); font-family: 'Poppins', sans-serif;
    font-weight: 900; font-size: 15px; padding: 15px 28px; border-radius: 10px;
    text-decoration: none; border: none; cursor: pointer; width: 100%;
    transition: opacity 0.15s, transform 0.15s; letter-spacing: 0.01em;
  }
  .btn-cta:hover { opacity: 0.9; }
  .btn-cta:active { transform: scale(0.98); }

  /* EMAIL FORM */
  .form-group { margin-bottom: 16px; }
  label {
    display: block; font-size: 11px; font-weight: 700; color: var(--ink-dark);
    margin-bottom: 7px; text-transform: uppercase; letter-spacing: 0.07em;
  }
  input[type="text"], input[type="email"] {
    width: 100%; padding: 13px 16px; border: 1.5px solid var(--line);
    border-radius: 10px; font-size: 15px; font-family: 'Poppins', sans-serif;
    font-weight: 400; color: var(--ink-dark); background: var(--white);
    transition: border-color 0.12s, box-shadow 0.12s;
  }
  input:focus {
    outline: none; border-color: var(--teal);
    box-shadow: 0 0 0 3px var(--teal-bg);
  }
  .err { font-size: 12px; font-weight: 700; color: #c0392b; margin-top: 5px; display: none; }
  .privacy { font-size: 11px; color: var(--muted); text-align: center; margin-top: 14px; line-height: 1.6; }

  /* LOADING */
  .loading-wrap { text-align: center; padding: 20px 0; }
  .spinner {
    width: 40px; height: 40px; border: 3px solid var(--line);
    border-top-color: var(--teal); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-wrap p { font-size: 14px; color: var(--muted); }

  .footer-brand {
    text-align: center; margin-top: 18px; font-size: 11px;
    font-weight: 700; color: var(--muted); letter-spacing: 0.04em;
  }
  .footer-brand a { color: var(--ink); text-decoration: none; font-weight: 900; }

  @media (max-width: 480px) {
    .card { padding: 28px 20px; border-radius: 16px; }
    h1 { font-size: 25px; }
    .q-title { font-size: 18px; }
    .result-intro h2 { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="shell">
  <div class="brand">par <span>DEBELIOU</span></div>
  <div class="card" id="card"></div>
  <div class="footer-brand">Un diagnostic offert par <a href="https://www.debeliou.com/contact/" target="_blank">DEBELIOU Agence</a></div>
</div>

<script>
(function () {
  "use strict";

  /* =========================================================
     QUESTIONS
  ========================================================= */
  const QUESTIONS = [
    {
      id: "secteur",
      pilier: null,
      pilierLabel: null,
      title: "Dans quel secteur évolue votre entreprise ?",
      type: "context",
      options: [
        { label: "Commerce / vente",                          value: "commerce" },
        { label: "Restauration / hôtellerie",                 value: "restauration" },
        { label: "Artisanat / production",                    value: "artisanat" },
        { label: "Services (conseil, immobilier, libéral...)", value: "services" },
        { label: "BTP / construction",                        value: "btp" },
        { label: "Autre",                                     value: "autre" }
      ]
    },
    {
      id: "trouvabilite",
      pilier: "notoriete",
      pilierLabel: "Notoriété",
      title: "Quand quelqu'un cherche votre entreprise en Martinique, est-ce qu'il peut vous trouver facilement ?",
      type: "score",
      options: [
        { label: "Non, je n'ai aucune présence en ligne",              value: "a", points: 0 },
        { label: "Oui, j'ai un site et/ou une fiche Google, mais pas à jour", value: "b", points: 1 },
        { label: "Oui, on me trouve sur les réseaux sociaux",                  value: "c", points: 2 },
        { label: "Oui — site, réseaux et fiche Google sont bien renseignés",   value: "d", points: 3 }
      ]
    },
    {
      id: "frequence",
      pilier: "notoriete",
      pilierLabel: "Notoriété",
      title: "À quelle fréquence communiquez-vous sur votre activité ?",
      type: "score",
      options: [
        { label: "Jamais ou presque",          value: "a", points: 0 },
        { label: "Quelques fois par mois",     value: "b", points: 1 },
        { label: "Plusieurs fois par semaine", value: "c", points: 2 },
        { label: "Tous les jours ou presque",  value: "d", points: 3 }
      ]
    },
    {
      id: "bouche_a_oreille",
      pilier: "fidelisation",
      pilierLabel: "Fidélisation",
      title: "Est-ce que vos clients vous recommandent spontanément à leur entourage ?",
      type: "score",
      options: [
        { label: "Rarement — je ne sais pas vraiment",             value: "a", points: 0 },
        { label: "Parfois, mais ce n'est pas régulier",            value: "b", points: 1 },
        { label: "Oui, régulièrement",                             value: "c", points: 2 },
        { label: "Oui, c'est une vraie source de nouveaux clients", value: "d", points: 3 }
      ]
    },
    {
      id: "lien_clients",
      pilier: "fidelisation",
      pilierLabel: "Fidélisation",
      title: "Avez-vous un moyen de garder le contact avec vos clients ?",
      type: "score",
      options: [
        { label: "Non, aucun",                                          value: "a", points: 0 },
        { label: "Une page réseaux sociaux",                            value: "b", points: 1 },
        { label: "Newsletter ou messages ponctuels",                    value: "c", points: 2 },
        { label: "Communication régulière et programme de fidélité",    value: "d", points: 3 }
      ]
    },
    {
      id: "differenciation",
      pilier: "differenciation",
      pilierLabel: "Différenciation",
      title: "Communiquez-vous sur vos avantages concurrentiels ?",
      type: "score",
      options: [
        { label: "Pas du tout", value: "a", points: 0 },
        { label: "Un peu",      value: "b", points: 1 },
        { label: "Moyen",       value: "c", points: 2 },
        { label: "Oui !",       value: "d", points: 3 }
      ]
    },
    {
      id: "identite_visuelle",
      pilier: "differenciation",
      pilierLabel: "Différenciation",
      title: "Votre identité visuelle (logo, couleurs, ton) est-elle cohérente sur tous vos supports ?",
      type: "score",
      options: [
        { label: "Non, c'est assez disparate",                      value: "a", points: 0 },
        { label: "À peu près, mais ça manque de cohérence",         value: "b", points: 1 },
        { label: "Oui, globalement",                                value: "c", points: 2 },
        { label: "Oui, c'est soigné et reconnaissable partout",     value: "d", points: 3 }
      ]
    },
    {
      id: "valeurs",
      pilier: "differenciation",
      pilierLabel: "Différenciation",
      title: "Vos clients savent-ils ce en quoi vous croyez, ce qui vous engage au-delà de votre service ?",
      type: "score",
      options: [
        { label: "Non, on ne parle jamais de ça",                             value: "a", points: 0 },
        { label: "Vaguement, mais ce n'est pas formalisé",                    value: "b", points: 1 },
        { label: "Oui, on l'exprime parfois dans notre communication",         value: "c", points: 2 },
        { label: "Oui, nos valeurs sont claires et visibles partout",          value: "d", points: 3 }
      ]
    }
  ];

  const PILIERS = {
    notoriete: {
      label: "Notoriété",
      icon: "📡",
      fillClass: "fill-notoriete",
      max: 6,
      niveaux: [
        { max: 2, label: "Faible",       cls: "niveau-faible" },
        { max: 4, label: "En développement", cls: "niveau-moyen" },
        { max: 6, label: "Fort",          cls: "niveau-fort" }
      ],
      textes: {
        faible: "Vous êtes difficile à trouver en ligne. Des clients potentiels cherchent ce que vous faites en ce moment — et trouvent vos concurrents à votre place.",
        moyen:  "Vous existez en ligne, mais votre présence manque de régularité. Une stratégie de contenu cohérente multiplierait votre visibilité sans effort supplémentaire.",
        fort:   "Votre notoriété est bien construite. L'enjeu maintenant : convertir cette visibilité en contacts qualifiés."
      }
    },
    fidelisation: {
      label: "Fidélisation",
      icon: "🤝",
      fillClass: "fill-fidelisation",
      max: 6,
      niveaux: [
        { max: 2, label: "Faible",       cls: "niveau-faible" },
        { max: 4, label: "En développement", cls: "niveau-moyen" },
        { max: 6, label: "Fort",          cls: "niveau-fort" }
      ],
      textes: {
        faible: "Vos clients satisfaits partent sans laisser de trace. Construire un lien durable avec eux, c'est transformer chaque vente en ambassadeur potentiel.",
        moyen:  "Vous gardez un lien avec certains clients, mais c'est irrégulier. Une communication ciblée post-achat augmente la valeur de chaque client existant.",
        fort:   "Vous fidélisez bien. Le prochain niveau : transformer vos clients fidèles en vecteurs actifs de recommandation."
      }
    },
    differenciation: {
      label: "Différenciation",
      icon: "✦",
      fillClass: "fill-differenciation",
      max: 9,
      niveaux: [
        { max: 3, label: "Faible",       cls: "niveau-faible" },
        { max: 6, label: "En développement", cls: "niveau-moyen" },
        { max: 9, label: "Fort",          cls: "niveau-fort" }
      ],
      textes: {
        faible: "Votre entreprise se distingue peu visuellement et dans son discours. Dans un marché concurrentiel, ce qui ne se voit pas n'existe pas.",
        moyen:  "Vous avez un positionnement, mais il n'est pas encore visible clairement. Le formaliser et l'exprimer dans votre communication ferait toute la différence.",
        fort:   "Vous avez une identité forte. Vérifiez qu'elle est parfaitement cohérente sur tous vos points de contact avec vos clients."
      }
    }
  };

  /* =========================================================
     RECOMMANDATIONS selon les scores
  ========================================================= */
  function buildRecos(scores) {
    const recos = [];
    const notoPct = scores.notoriete / 6;
    const fidelPct = scores.fidelisation / 6;
    const diffPct = scores.differenciation / 9;

    // Priorité par score le plus faible
    const ranked = [
      { key: "notoriete", pct: notoPct },
      { key: "fidelisation", pct: fidelPct },
      { key: "differenciation", pct: diffPct }
    ].sort((a, b) => a.pct - b.pct);

    const recoMap = {
      notoriete: [
        { label: "Créer ou refondre votre présence en ligne", desc: "Site vitrine, fiche Google My Business, profils sociaux cohérents. C'est la base pour être trouvé par des clients qui ne vous connaissent pas encore." },
        { label: "Mettre en place un calendrier éditorial", desc: "Publier régulièrement avec un fil directeur clair. La régularité construit la confiance et l'algorithme." }
      ],
      fidelisation: [
        { label: "Créer un dispositif de suivi client post-achat", desc: "Email de remerciement, message de suivi, demande d'avis. Un client qui se sent considéré revient et recommande." },
        { label: "Activer un programme de recommandation", desc: "Encouragez vos clients satisfaits à parler de vous. Un simple message au bon moment peut déclencher plusieurs nouvelles ventes." }
      ],
      differenciation: [
        { label: "Formaliser votre identité de marque", desc: "Logo, charte couleurs, ton de voix, valeurs exprimées. Une identité cohérente rassure les clients et vous distingue de la concurrence." },
        { label: "Raconter ce qui vous rend unique", desc: "Vos valeurs, votre histoire, votre vision. Les clients d'aujourd'hui choisissent les marques qu'ils comprennent et dans lesquelles ils se reconnaissent." }
      ]
    };

    ranked.forEach(({ key }) => {
      recoMap[key].forEach(r => recos.push(r));
    });

    return recos.slice(0, 3);
  }

  /* =========================================================
     ÉTAT
  ========================================================= */
  // Lire l'email depuis le paramètre URL (?email=...)
  const urlEmail = new URLSearchParams(window.location.search).get("email") || "";

  const state = { screen: "intro", currentQ: 0, answers: {}, leadData: { email: urlEmail } };
  const card = document.getElementById("card");

  /* =========================================================
     CALCULS
  ========================================================= */
  function computeScores() {
    const scores = { notoriete: 0, fidelisation: 0, differenciation: 0 };
    QUESTIONS.forEach(q => {
      if (!q.pilier) return;
      const opt = q.options.find(o => o.value === state.answers[q.id]);
      if (opt && typeof opt.points === "number") scores[q.pilier] += opt.points;
    });
    return scores;
  }

  function getNiveau(pilierKey, score) {
    const p = PILIERS[pilierKey];
    return p.niveaux.find(n => score <= n.max) || p.niveaux[p.niveaux.length - 1];
  }

  function getNiveauTexte(pilierKey, score) {
    const p = PILIERS[pilierKey];
    const max = p.max;
    const pct = score / max;
    if (pct <= 0.33) return p.textes.faible;
    if (pct <= 0.66) return p.textes.moyen;
    return p.textes.fort;
  }

  function computeProfilRapport(scores) {
    const n = scores.notoriete / 6;
    const f = scores.fidelisation / 6;
    const d = scores.differenciation / 9;

    const tousEleves = n >= 0.67 && f >= 0.67 && d >= 0.67;
    const tousFaibles = n <= 0.33 && f <= 0.33 && d <= 0.33;

    if (tousFaibles) return "faible_3";
    if (tousEleves)  return "fort_3";
    if (n <= f && n <= d) return "faible_notoriete";
    if (f <= n && f <= d) return "faible_fidelisation";
    return "faible_differenciation";
  }

  function buildPayload(email) {
    const scores = computeScores();
    const { prenom, nom, company } = state.leadData || {};
    return {
      email,
      prenom:  prenom || "",
      nom:     nom || "",
      company: company || "",
      score_notoriete:        scores.notoriete,
      score_fidelisation:     scores.fidelisation,
      score_differenciation:  scores.differenciation,
      niveau_notoriete:       getNiveau("notoriete", scores.notoriete).label,
      niveau_fidelisation:    getNiveau("fidelisation", scores.fidelisation).label,
      niveau_differenciation: getNiveau("differenciation", scores.differenciation).label,
      profil_rapport:         computeProfilRapport(scores),
      submitted_at:           new Date().toISOString()
    };
  }

  /* =========================================================
     RENDER
  ========================================================= */
  function render() {
    card.style.animation = "none";
    card.offsetHeight;
    card.style.animation = "";
    if (state.screen === "intro")    return renderIntro();
    if (state.screen === "question") return renderQuestion();
    if (state.screen === "email")    return renderEmail();
    if (state.screen === "loading")  return renderLoading();
    if (state.screen === "result")   return renderResult();
  }

  /* --- INTRO / CAPTURE --- */
  function renderIntro() {
    card.innerHTML = `
      <div class="eyebrow">Diagnostic gratuit · 5 minutes</div>
      <h1>Votre marque est-elle aussi visible qu'elle devrait l'être&nbsp;?</h1>
      <p class="lede">8 questions pour mesurer votre notoriété, votre fidélisation et votre différenciation — et savoir exactement sur quoi agir en priorité.</p>
      <div class="meta-strip">
        <div class="meta-item"><strong>8</strong><span>questions</span></div>
        <div class="meta-item"><strong>3</strong><span>piliers analysés</span></div>
        <div class="meta-item"><strong>100%</strong><span>gratuit</span></div>
      </div>

      <div class="form-group">
        <label for="cap-prenom">Prénom *</label>
        <input type="text" id="cap-prenom" placeholder="Marie" autocomplete="given-name">
        <div class="err" id="err-prenom">Ce champ est obligatoire.</div>
      </div>
      <div class="form-group">
        <label for="cap-nom">Nom de famille *</label>
        <input type="text" id="cap-nom" placeholder="Dupont" autocomplete="family-name">
        <div class="err" id="err-nom">Ce champ est obligatoire.</div>
      </div>
      <div class="form-group">
        <label for="cap-company">Nom de l'entreprise *</label>
        <input type="text" id="cap-company" placeholder="Restaurant Chez Manette" autocomplete="organization">
        <div class="err" id="err-company">Ce champ est obligatoire.</div>
      </div>
      <div class="form-group">
        <label for="cap-email">E-mail *</label>
        <input type="email" id="cap-email" placeholder="vous@monentreprise.com" autocomplete="email">
        <div class="err" id="err-email">Entrez une adresse email valide.</div>
      </div>

      <div style="margin-bottom:20px; padding:16px; background:var(--blue-bg); border-radius:12px; border:1px solid var(--line);">
        <p style="font-size:12px; color:var(--ink-mid); line-height:1.7; margin:0;">
          En cliquant sur <strong>"Démarrer mon diagnostic"</strong>, vous acceptez de recevoir des informations de la part de <strong>DEBELIOU Agence</strong> sur votre adresse email, notamment les résultats de ce diagnostic et des conseils personnalisés en communication. Vos coordonnées restent strictement confidentielles et ne seront jamais transmises à des tiers.<br><br>
          <strong>Conformément au RGPD</strong> (Règlement Général sur la Protection des Données — UE 2016/679), vous disposez d'un droit d'accès, de rectification et de suppression de vos données, ainsi que d'un droit d'opposition et de désinscription à tout moment en cliquant sur le lien de désabonnement présent dans chaque email. Pour exercer vos droits, contactez-nous à <a href="mailto:contact@debeliou.com" style="color:var(--ink);">contact@debeliou.com</a>.
        </p>
      </div>

      <button class="btn btn-primary" id="start-btn">Démarrer mon diagnostic</button>
    `;

    document.getElementById("start-btn").addEventListener("click", () => {
      const prenom  = document.getElementById("cap-prenom").value.trim();
      const nom     = document.getElementById("cap-nom").value.trim();
      const company = document.getElementById("cap-company").value.trim();
      const email   = document.getElementById("cap-email").value.trim();
      const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

      let valid = true;
      document.getElementById("err-prenom").style.display  = prenom   ? "none" : "block"; if (!prenom)   valid = false;
      document.getElementById("err-nom").style.display     = nom      ? "none" : "block"; if (!nom)      valid = false;
      document.getElementById("err-company").style.display = company  ? "none" : "block"; if (!company)  valid = false;
      document.getElementById("err-email").style.display   = emailOk  ? "none" : "block"; if (!emailOk)  valid = false;

      if (!valid) return;

      state.leadData = { prenom, nom, company, email };
      state.screen = "question"; state.currentQ = 0; render();
    });
  }

  /* --- QUESTION --- */
  function renderQuestion() {
    const idx = state.currentQ;
    const q = QUESTIONS[idx];
    const selected = state.answers[q.id];
    const progress = Math.round((idx / QUESTIONS.length) * 100);

    card.innerHTML = `
      <div class="prog-wrap">
        <div class="prog-track"><div class="prog-fill" style="width:${progress}%"></div></div>
        <div class="prog-meta">
          <span class="prog-label">Question ${idx + 1} / ${QUESTIONS.length}</span>
          ${q.pilierLabel ? `<span class="prog-pilier">${q.pilierLabel}</span>` : ""}
        </div>
      </div>
      <div class="q-title">${q.title}</div>
      <div class="options" role="radiogroup">
        ${q.options.map(o => `
          <button class="option${selected === o.value ? " selected" : ""}"
            data-value="${o.value}" role="radio" aria-checked="${selected === o.value}">
            <span class="opt-dot"></span>
            <span>${o.label}</span>
          </button>
        `).join("")}
      </div>
      <div class="nav">
        <button class="btn btn-ghost" id="back-btn">← Retour</button>
      </div>
    `;

    card.querySelectorAll(".option").forEach(btn => {
      btn.addEventListener("click", () => {
        state.answers[q.id] = btn.dataset.value;
        card.querySelectorAll(".option").forEach(b => {
          b.classList.toggle("selected", b.dataset.value === btn.dataset.value);
          b.setAttribute("aria-checked", b.dataset.value === btn.dataset.value);
        });
        setTimeout(goNext, 280);
      });
    });

    document.getElementById("back-btn").addEventListener("click", () => {
      if (idx === 0) { state.screen = "intro"; render(); }
      else { state.currentQ--; render(); }
    });
  }

  function goNext() {
    if (state.currentQ < QUESTIONS.length - 1) {
      state.currentQ++; render();
    } else {
      state.screen = "email"; render();
    }
  }

  /* --- EMAIL (confirmation finale) --- */
  function renderEmail() {
    const { prenom, email } = state.leadData || {};
    card.innerHTML = `
      <div class="eyebrow">Dernière étape</div>
      <h1 style="font-size:24px; margin-bottom:10px;">Votre rapport est prêt&nbsp;!</h1>
      <p class="sub">On envoie votre diagnostic complet à <strong style="color:var(--ink-dark);">${email || "votre adresse email"}</strong>. Confirmez pour voir vos résultats.</p>
      <button class="btn btn-primary" id="submit-btn">Voir mon rapport →</button>
      <p class="privacy" style="margin-top:12px;">Aucun spam. Votre rapport, puis quelques conseils pratiques.<br>Désabonnement en un clic à tout moment.</p>
    `;
    document.getElementById("submit-btn").addEventListener("click", () => {
      const email = state.leadData?.email;
      if (email) submitLead(buildPayload(email));
      state.screen = "result"; render();
    });
  }

  /* --- LOADING --- */
  function renderLoading() {
    card.innerHTML = `
      <div class="loading-wrap">
        <div class="spinner"></div>
        <p>Génération de votre rapport en cours...</p>
      </div>
    `;
  }

  /* --- RÉSULTAT --- */
  function renderResult() {
    const scores = computeScores();
    const recos  = buildRecos(scores);
    const name   = state.leadData?.name || "";

    card.innerHTML = `
      <div class="result-intro">
        <div class="eyebrow">Votre diagnostic de visibilité</div>
        <h2>${name ? `${name}, voici votre rapport` : "Votre rapport personnalisé"}</h2>
        <p>Voici l'état de votre marque sur les 3 piliers d'une communication efficace.</p>
      </div>

      <div class="piliers" id="piliers-wrap">
        ${["notoriete","fidelisation","differenciation"].map(key => {
          const p       = PILIERS[key];
          const score   = scores[key];
          const niveau  = getNiveau(key, score);
          const texte   = getNiveauTexte(key, score);
          const pct     = Math.round((score / p.max) * 100);
          return `
            <div class="pilier-card">
              <div class="pilier-header">
                <div class="pilier-name">
                  <span class="pilier-icon">${p.icon}</span>
                  ${p.label}
                </div>
                <span class="pilier-niveau ${niveau.cls}">${niveau.label}</span>
              </div>
              <div class="pilier-track">
                <div class="pilier-fill ${p.fillClass}" data-pct="${pct}" style="width:0%"></div>
              </div>
              <p class="pilier-text">${texte}</p>
            </div>
          `;
        }).join("")}
      </div>

      <div class="reco-section">
        <div class="reco-title">Vos 3 leviers prioritaires</div>
        <div class="reco-items">
          ${recos.map((r, i) => `
            <div class="reco-item">
              <div class="reco-num">${i + 1}</div>
              <div class="reco-content">
                <div class="reco-label">${r.label}</div>
                <div class="reco-desc">${r.desc}</div>
              </div>
            </div>
          `).join("")}
        </div>
      </div>

      <div class="cta-box">
        <h3>Passons à l'action&nbsp;?</h3>
        <p>DEBELIOU accompagne les TPE-PME martiniquaises à construire une communication qui convertit. Demandez votre devis gratuit, sans engagement.</p>
        <a href="https://www.debeliou.com/contact/" target="_blank" class="btn-cta">
          Demander un devis gratuit →
        </a>
      </div>
    `;

    // Anime les barres après rendu
    setTimeout(() => {
      card.querySelectorAll(".pilier-fill[data-pct]").forEach(el => {
        el.style.width = el.dataset.pct + "%";
      });
    }, 80);
  }

  /* =========================================================
     SYSTEME.IO — submitLead via Netlify Function (proxy)
     Evite le blocage CORS de l'API Systeme.io côté navigateur.
  ========================================================= */
  async function submitLead(payload) {
    try {
      const res = await fetch("/.netlify/functions/submit-lead", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      console.log("✅ Lead envoyé :", data);
    } catch (err) {
      console.error("⚠️ Erreur submit :", err);
    }
  }

  /* =========================================================
     INIT
  ========================================================= */
  render();
})();
</script>
</body>
</html>
